<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Para ti mi neni 💖</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            color: #ff4d6d;
        }

        #texto {
            font-size: 1.2em;
            white-space: pre-line;
            margin-top: 20px;
            min-height: 120px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Para ti mi neni❤️</h1>
        <div id="texto"></div>

        <button onclick="iniciarTodo()">Abrir 💌</button>
    </div>

    <audio id="musica" src="cancion.mp3"></audio>

    <script>
        const mensaje = `Hola mi amor 💕,

Quiero empezar diciéndote perdón… de verdad lo siento por haberte fallado. Sé que no he estado a la altura de lo que te mereces, y eso me duele porque tú eres lo más importante en mi vida

Eres lo mejor que me ha pasado, y no quiero que nunca dudes de lo mucho que me importas. Quiero que te sientas segura a mi lado, que sientas que conmigo tienes un futuro tranquilo, lleno de amor y confianza ❤️

Todo lo que soy y todo lo que tengo es tuyo, porque tú eres todo para mí. No hay un día en que no agradezca tenerte en mi vida ✨

Prometo seguir mejorando por nosotros y ser más presente. Pero sobre todo, prometo que siempre te voy a amar 💖

Te amo muchísimo ❤️`;

        let i = 0;

        function escribir() {
            if (i < mensaje.length) {
                document.getElementById("texto").innerHTML += mensaje.charAt(i);
                i++;
                setTimeout(escribir, 40);
            }
        }

        function iniciarTodo() {
            document.getElementById("musica").play();

            escribir();

            setInterval(crearCorazon, 300);
        }

        function crearCorazon() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerText = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 20 + 10) + "px";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
    </script>

</body>

</html>
